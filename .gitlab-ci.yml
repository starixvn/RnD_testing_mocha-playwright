image: 
  name: git3.nexdev.net:5050/rnd/testing/mocha-playwright
  # name: roshannguyen/pwimg

stages: 
  - test
  - config-report
  - public-report
  - cleanup

test:
  stage: test
  tags:
    - docker-automation-test
  script:
    - npm install
    - echo "JOBR=$CI_JOB_ID" >> build.env
    - set NODE_ENV=$env
    - echo "Set Balance"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001051&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001052&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001053&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001054&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001055&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001056&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001057&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001058&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001059&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001060&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - curl "http://l1-ows1.lumigame.com/SabaClub/CreateCustomer?memId=1830746" --data-raw "ObCustId=1001061&Balance=200000&Minbet=1.00&MaxBet=3000.00"
    - echo "Start Run $Mode"
    - npm run $Mode
  artifacts:
    paths:
      - Report/
      - build.env
    when: always
    expire_in: 1 day 

config_report:
  stage: config-report
  tags:
  - docker-automation-test
  script: 
    - exit 0
  when: always 
  artifacts:
    reports:
      dotenv: 
        - build.env
    when: always
    expire_in: 1 day


public_report:
  stage: public-report
  tags:
    - docker-automation-test
  script:
    - npm install
    - set NODE_ENV=$env
    - npm run sendResultToTelegram --args=Job=$JOBR
  when: always

cleanup_job:
  stage: cleanup
  tags:
    - docker-automation-test
  script:
    - echo "Cleaning up"
    - rm -rf "%CACHE_PATH%/%CI_PIPELINE_ID%"
  when: always
