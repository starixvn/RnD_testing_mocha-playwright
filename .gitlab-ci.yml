image: 
  name: git3.nexdev.net:5050/rnd/testing/qc-auto-image
  # name: roshannguyen/pwimg

stages: 
  - full-test
  - smoke-test
  - config-report
  - public-report
  - cleanup

test1:
  stage: full-test
  tags:
    - docker-automation-test
  script:
    - npm install --no-optional
    - echo "JOBR=$CI_JOB_ID" >> build.env
    - npm run $Mode --args=env=$env --lang=$lang
  rules:
    - if: $PRODUCT == "All"
  artifacts:
    paths:
      - Report/$lang
      - build.env
    when: always
    expire_in: 1 day 

test2:
  stage: smoke-test
  tags:
    - docker-automation-test
  script:
    - npm install --no-optional 
    - npm run CI_SelGame_Smoke --lang=$lang_smoke --game=$PRODUCT
  rules:
    - if: $PRODUCT != "All"
  artifacts:
    paths:
      - Report/$lang_smoke
      - build.env
    when: always
    expire_in: 1 day 

