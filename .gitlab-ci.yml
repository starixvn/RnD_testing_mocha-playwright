image: 
  name: git3.nexdev.net:5050/rnd/testing/qc-auto-image
  # name: roshannguyen/pwimg

stages: 
  - test
  # - report

test1:
  stage: test
  tags:
    - docker-automation-test
  script:
    - echo $CI_PIPELINE_ID
    - npm install --no-optional
    - npm run CI_SelGame_$Mode --args=env=$env --game=$PRODUCT --cf_lang=$cf_lang
    - npm run sendResultToTelegram --args=Job=$CI_PIPELINE_ID-env=$env --cf_lang=$cf_lang --mode=$Mode
  artifacts:
    paths:
      - Report/$cf_lang
    when: always
    expire_in: 1 day 

